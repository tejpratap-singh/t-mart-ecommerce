<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - T MART</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <h1>T MART</h1>

        <h2>Welcome Back 👋</h2>

        <p>Login to continue shopping</p>

        <form id="loginForm">

    <!-- ================= Email Login ================= -->

    <div id="emailLoginSection">

       <div class="input-box">

    <i class="fa-solid fa-envelope input-icon"></i>

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required>

</div>

      <div class="input-box">

    <i class="fa-solid fa-lock input-icon"></i>

    <input
        type="password"
        id="password"
        placeholder="Password"
        required>
        <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>

</div>

        <div class="login-options">

            <a href="#" id="anotherWay">
                Sign in with another way
            </a>

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>

        <button type="submit">
            Login
        </button>

    </div>

    <!-- ================= Phone Login ================= -->

    <div
        id="phoneLoginSection"
        class="phone-login-section"
        style="display:none;">

        <div class="input-box">

            <input
                type="tel"
                id="phoneNumber"
                placeholder="Enter Mobile Number"
                maxlength="10">

        </div>

        <button
            type="button"
            id="sendOtpBtn">

            Send OTP

        </button>

        <div class="input-box">

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
                maxlength="6">

        </div>

        <button
            type="button"
            id="verifyOtpBtn">

            Verify OTP

        </button>

        <p class="back-login">

            <a href="#" id="backToEmail">

                ← Back to Email Login

            </a>

        </p>

    </div>

</form>

        <p class="signup-link">

            Don't have an account?

            <a href="signup.html">

                Create Account

            </a>

        </p>

    </div>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
