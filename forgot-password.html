<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - T MART</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <h1>T MART</h1>
        <h2>Reset Password 🔑</h2>
        <p>Enter your registered email address to receive password reset instructions</p>

        <form id="forgotForm">
            <div class="input-box">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="resetEmail" placeholder="Email Address" required>
            </div>

            <button type="submit">
                Send Reset Link
            </button>
        </form>

        <p class="signup-link">
            Remembered your password?
            <a href="login.html">Back to Login</a>
        </p>

        <p style="margin-top: 15px;">
            <a href="index.html" style="color: #234f55; text-decoration: none; font-weight: 600;">
                ← Back to Home
            </a>
        </p>
    </div>
</div>

<script type="module">
    const form = document.getElementById("forgotForm");
    if (form) {
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("resetEmail").value;
            alert(`Password reset link has been sent to ${email}. Please check your inbox!`);
            window.location.href = "login.html";
        });
    }
</script>

</body>
</html>
